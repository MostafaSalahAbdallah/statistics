<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle inner glow overlay -->
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- Chart grid lines (subtle) -->
  <line x1="12" y1="46" x2="52" y2="46" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="12" y1="36" x2="52" y2="36" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="12" y1="26" x2="52" y2="26" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- X axis baseline -->
  <line x1="12" y1="46" x2="12" y2="12" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="46" x2="52" y2="46" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Trending line (analytics chart) -->
  <polyline
    points="16,40 24,34 32,28 40,22 48,16"
    fill="none"
    stroke="white"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Data point dots -->
  <circle cx="16" cy="40" r="2.5" fill="white"/>
  <circle cx="24" cy="34" r="2.5" fill="white"/>
  <circle cx="32" cy="28" r="2.5" fill="white"/>
  <circle cx="40" cy="22" r="2.5" fill="white"/>
  <circle cx="48" cy="16" r="3.2" fill="white" opacity="1"/>
  <!-- Highlight ring on last dot -->
  <circle cx="48" cy="16" r="5.5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>

  <!-- Small smile arc at bottom (subtle tooth reference) -->
  <path
    d="M 22 54 Q 32 59 42 54"
    fill="none"
    stroke="rgba(255,255,255,0.55)"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
